[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openmlkitOCR"
version = "1.0.3"
description = "A lightweight offline OCR library using Google ML Kit TFLite models"
readme = "README.md"
authors = [
    { name = "0cve0" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "numpy<2.0.0",
    "opencv-python",
    "tflite-runtime",
    "huggingface_hub",
]
requires-python = ">=3.7"

[project.urls]
Homepage = "https://github.com/0cve0/OpenMLkitOCR"
Repository = "https://github.com/0cve0/OpenMLkitOCR.git"
"Bug Tracker" = "https://github.com/0cve0/OpenMLkitOCR/issues"
"Hugging Face" = "https://huggingface.co/0cve0/OpenMLKitOCR"

[tool.setuptools.packages.find]
where = ["."]
include = ["openmlkit*"]
exclude = ["hf_upload_models*", "scratch*", "android*"]
